services:
  backend:
    image: registry.cn-hangzhou.aliyuncs.com/smartcv/smartcv-backend:v1
    ports:
      - "8600:8600"
    volumes:
      - /opt/smartcv/stats:/app/data
      - /opt/smartcv/reference-examples:/app/reference-examples
    environment:
      SMARTCV_REFERENCE_DIR: /app/reference-examples
      SEARXNG_URL: http://searxng:8080
    depends_on:
      - searxng
    healthcheck:
      test: ["CMD", "python", "-c", "import socket,sys; s=socket.socket(); s.settimeout(3); s.connect(('127.0.0.1',8600)); s.close()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    image: registry.cn-hangzhou.aliyuncs.com/smartcv/smartcv-frontend:v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "443:443"
    volumes:
      - /opt/smartcv/certs/:/etc/nginx/certs:ro
      - /opt/smartcv/logs:/var/log/nginx
    command:
      - /bin/sh
      - -c
      - |
        ts=$$(date +%Y%m%d-%H%M%S)
        for f in access error; do
          if [ -f /var/log/nginx/$$f.log ]; then
            mv /var/log/nginx/$$f.log /var/log/nginx/$$f.$$ts.log
          fi
        done
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "--max-time", "3", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  searxng:
    image: searxng/searxng:v1
    pull_policy: never
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-smartcv-searxng-secret}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
