log_format smartcv escape=json
    '{'
      '"time":"$time_iso8601",'
      '"ip":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"proto":"$server_protocol",'
      '"host":"$host",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"request_id":"$request_id",'
      '"session_id":"$http_x_agent_session_id",'
      '"xff":"$http_x_forwarded_for",'
      '"referer":"$http_referer",'
      '"ua":"$http_user_agent"'
    '}';

log_format smartcv_tls escape=json
    '{'
      '"time":"$time_iso8601",'
      '"ip":"$remote_addr",'
      '"method":"$request_method",'
      '"uri":"$request_uri",'
      '"proto":"$server_protocol",'
      '"host":"$host",'
      '"tls":"$ssl_protocol/$ssl_cipher",'
      '"status":$status,'
      '"bytes":$body_bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_time":"$upstream_response_time",'
      '"upstream_addr":"$upstream_addr",'
      '"upstream_status":"$upstream_status",'
      '"request_id":"$request_id",'
      '"session_id":"$http_x_agent_session_id",'
      '"xff":"$http_x_forwarded_for",'
      '"referer":"$http_referer",'
      '"ua":"$http_user_agent"'
    '}';

server {
    listen 80;
    server_name smart-cv.tech www.smart-cv.tech;
    return 301 https://$host$request_uri;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log smartcv;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Agent-Session-Id $http_x_agent_session_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}

server {
    listen 443 ssl;
    server_name smart-cv.tech www.smart-cv.tech;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log smartcv_tls;
    error_log /var/log/nginx/error.log debug;
    ssl_certificate     /etc/nginx/certs/smart-cv.tech_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/smart-cv.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8600;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Agent-Session-Id $http_x_agent_session_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
        proxy_cache off;

        add_header X-Accel-Buffering no;
    }
}
