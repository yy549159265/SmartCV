# SmartCV 前端 nginx：托管静态文件 + 把 /api 反向代理到后端容器
# 后端容器在 compose 网络里的服务名是 backend，端口 8600。
#
# 同时监听：
#   80  —— 兼容 HTTP / 容器内健康检查
#   443 —— 对外 HTTPS。File System Access API（本地备份文件夹）只在
#          https 或 localhost 下可用，所以对外访问必须走 443。
#
# 证书：/etc/nginx/certs/smartcv.crt 和 smartcv.key
# 生成：scripts/gen-self-signed-cert.sh（自签 CA，浏览器需信任 certs/smartcv-ca.crt）

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api → 后端 FastAPI。
    # SSE（/api/chat）必须关缓冲 + 长超时，否则流式会被缓冲/掐断。
    location /api/ {
        proxy_pass http://backend:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 透传前端会话 id（前端统一带 X-Agent-Session-Id 头）
        proxy_set_header X-Agent-Session-Id $http_x_agent_session_id;
        # SSE：关闭缓冲与缓存，拉长读写超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/certs/smart-cv.tech_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/smart-cv.tech.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api → 后端 FastAPI（与 80 端口配置一致）
    location /api/ {
        proxy_pass http://backend:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Agent-Session-Id $http_x_agent_session_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
