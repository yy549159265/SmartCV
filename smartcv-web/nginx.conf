# SmartCV 前端 nginx：托管静态文件 + 把 /api 反向代理到后端容器
# 后端容器在 compose 网络里的服务名是 backend，端口 8600。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 前端路由兜底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api → 后端 FastAPI。
    # SSE（/api/chat）必须关缓冲 + 长超时，否则流式会被缓冲/掐断。
    location /api/ {
        proxy_pass http://backend:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 透传前端会话 id（前端统一带 X-Agent-Session-Id 头）
        proxy_set_header X-Agent-Session-Id $http_x_agent_session_id;
        # SSE：关闭缓冲与缓存，拉长读写超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }
}
