  <path d="M340 65 V125 Q340 145 360 145 H420"
        fill="#CDD5FF"/>

  <!-- Avatar -->
  <circle cx="175" cy="190" r="28" fill="#6579F2"/>
  <path d="M138 265 Q138 230 175 230 Q212 230 212 265"
        fill="#6579F2"/>

  <!-- Resume Lines -->
  <rect x="235" y="180" width="120" height="12" rx="6" fill="#687BF0"/>
  <rect x="235" y="207" width="95" height="9" rx="4.5" fill="#B3BDF8"/>
  <rect x="138" y="290" width="235" height="9" rx="4.5" fill="#C0C9F8"/>

  <!-- Brand Name inside icon -->
  <text x="255" y="365"
