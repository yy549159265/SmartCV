
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7187FF"/>
      <stop offset="100%" stop-color="#4936C8"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E8ECFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <circle cx="410" cy="105" r="95" fill="#FFFFFF" opacity=".07"/>
  <circle cx="80" cy="420" r="120" fill="#FFFFFF" opacity=".06"/>

  <!-- Resume Document -->
  <path d="M90 65 H340 L420 145 V425 Q420 445 400 445 H110 Q90 445 90 425 Z"
